name: Lighthouse CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: bookly-ci-lighthouse
      LIGHTHOUSE_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Prepare application
        uses: ./.github/actions/prepare-browser-ci
        
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './frontend/lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Application diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --tail=100
          docker compose -f docker-compose.ci.yml exec -T nextjs cat .next/ci-server.log || true

      - name: Stop application
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
