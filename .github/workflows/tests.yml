name: Tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Backend Tests (PHP)
  # -------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bookly_test
          POSTGRES_USER: bookly_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookly_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: test-key
          MEILI_ENV: development
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Resolve disposable test services
        run: |
          echo '127.0.0.1 bookly-test-postgres bookly-test-meilisearch' | sudo tee -a /etc/hosts
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://bookly-test-meilisearch:7700/health

      - name: Execute tests
        run: php artisan test --configuration=phpunit.pgsql.xml

  # -------------------------------------------------------------------
  # Backend Static Analysis (PHPStan/Larastan)
  # -------------------------------------------------------------------
  backend-static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  # -------------------------------------------------------------------
  # Backend Code Style (Laravel Pint)
  # -------------------------------------------------------------------
  backend-code-style:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    name: Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  # -------------------------------------------------------------------
  # Frontend Type Check & Lint
  # -------------------------------------------------------------------
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    name: Frontend Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # -------------------------------------------------------------------
  # Frontend Unit Tests (Jest)
  # -------------------------------------------------------------------
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    name: Frontend Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --ci

  # -------------------------------------------------------------------
  # Frontend E2E Tests (Playwright)
  # -------------------------------------------------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: bookly-ci-e2e
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    defaults:
      run:
        working-directory: frontend
    name: E2E Tests
    needs: [frontend-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare application
        uses: ./.github/actions/prepare-browser-ci

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Application diagnostics
        if: failure()
        working-directory: .
        run: |
          docker compose -f docker-compose.ci.yml logs --tail=100
          docker compose -f docker-compose.ci.yml exec -T nextjs cat .next/ci-server.log || true
          tail -n 100 backend/storage/logs/laravel.log || true

      - name: Stop application
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.ci.yml down -v
