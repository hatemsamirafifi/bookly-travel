<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Global Tours Marketplace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#260a42",
                        "accent": "#FFB800",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .social-btn {
            @apply flex items-center justify-center gap-3 w-full py-3 px-4 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-background-dark text-slate-700 dark:text-slate-200 font-medium transition-all hover:bg-slate-50 dark:hover:bg-slate-800;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4 font-display">
<div class="w-full max-w-[440px] bg-white dark:bg-background-dark/50 shadow-xl dark:shadow-2xl rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800">
<div class="p-8 pb-0 flex flex-col items-center">
<div class="size-16 bg-primary rounded-xl flex items-center justify-center mb-8 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-3xl">explore</span>
</div>
<h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100 mb-2">Welcome back</h1>
<p class="text-slate-500 dark:text-slate-400 text-center mb-8">Adventure is calling. Log in to your account to continue your journey.</p>
</div>
<div class="px-8 pb-8 space-y-5">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-accent transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
<a class="text-xs font-semibold text-primary dark:text-accent hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-accent transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all active:scale-[0.98] mt-2">
                Sign In
            </button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-background-dark px-4 text-slate-500 font-medium">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 font-semibold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12 5.04c1.64 0 3.12.56 4.28 1.67l3.21-3.21C17.52 1.63 14.95 0 12 0 7.31 0 3.32 2.69 1.38 6.61l3.75 2.91c.88-2.64 3.37-4.48 6.87-4.48z" fill="#EA4335"></path>
<path d="M23.49 12.27c0-.85-.07-1.66-.21-2.45H12v4.64h6.44c-.28 1.47-1.11 2.72-2.35 3.56l3.66 2.84c2.14-1.97 3.39-4.88 3.39-8.59z" fill="#4285F4"></path>
<path d="M5.13 14.48c-.24-.72-.38-1.48-.38-2.28s.14-1.56.38-2.28L1.38 6.61C.5 8.37 0 10.33 0 12.4s.5 4.03 1.38 5.79l3.75-2.91z" fill="#FBBC05"></path>
<path d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.66-2.84c-1.1.74-2.51 1.18-4.29 1.18-3.5 0-6.47-2.36-7.53-5.54L.73 16.81C2.68 20.73 6.67 23.4 12 24z" fill="#34A853"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 font-semibold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.23 2.3-1.18.57-2.41.86-3.68.86-1.63 0-3.14-.4-4.52-1.21-1.38-.81-2.48-1.92-3.3-3.33C1.51 17.5.31 15.6 0 13.56c0-2.36.42-4.5 1.25-6.4C2.08 5.25 3.2 3.65 4.6 2.37 6.01 1.09 7.6 0 9.38 0c1.33 0 2.58.33 3.75 1 .7.4 1.45.8 2.25.8.78 0 1.52-.4 2.23-.8 1.15-.64 2.39-.97 3.72-.97 1.43 0 2.74.34 3.93 1.02.5.3.93.63 1.3.99-1.37.56-2.45 1.5-3.24 2.82-.79 1.32-1.18 2.77-1.18 4.35 0 1.95.53 3.66 1.6 5.11.83 1.13 1.91 2.01 3.23 2.64-.17.48-.36.93-.57 1.35zM15.48 4.66c-.95.84-2.04 1.26-3.26 1.26-.06-1.33.37-2.58 1.29-3.75.92-1.17 2.07-1.85 3.44-2.03.07 1.36-.4 2.65-1.47 4.52z"></path>
</svg>
                    Apple
                </button>
</div>
</div>
<div class="bg-slate-50 dark:bg-slate-900/80 p-6 border-t border-slate-100 dark:border-slate-800 text-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                Don't have an account? 
                <a class="text-primary dark:text-accent font-bold hover:underline ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<div class="mt-8 flex gap-6">
<div class="flex items-center gap-2 text-slate-400 dark:text-slate-500 text-xs">
<span class="material-symbols-outlined text-sm">public</span>
<span>English (US)</span>
</div>
<div class="flex items-center gap-2 text-slate-400 dark:text-slate-500 text-xs">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>Secure Checkout</span>
</div>
</div>
<div class="fixed bottom-0 left-0 w-full h-1.5 flex">
<div class="flex-1 bg-primary"></div>
<div class="flex-1 bg-accent"></div>
<div class="flex-1 bg-primary/80"></div>
<div class="flex-1 bg-accent/80"></div>
</div>
</body></html>
