user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream for PHP-FPM (Laravel backend)
    upstream php_fpm {
        server laravel:9000;
    }

    # Upstream for Next.js frontend
    upstream nextjs_app {
        server nextjs:3000;
    }

    # Local fixture CDN (test/dev only). Seeded tour media reference
    # http://cdn.bookly.test/...; the hostname resolves inside the Docker
    # network to this proxy via the service's network alias, and these
    # deterministic fixture files are served so the Next.js image optimizer
    # (which fetches server-side) succeeds. Browsers only ever see
    # same-origin /_next/image URLs. Production uses the real CDN.
    server {
        listen 80;
        server_name cdn.bookly.test;

        root /var/cdn;
        access_log /var/log/nginx/cdn-access.log main;

        location / {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    server {
        # Default server: handles every Host that is not cdn.bookly.test,
        # including the in-Docker service hostname (Host: nginx) used by
        # the frontend's server-side API fetches. This MUST stay the
        # default; otherwise unmatched hosts fall into the first block
        # (the fixture CDN) and API routes 404.
        listen 80 default_server;
        server_name localhost;

        # Root directory for backend files
        root /var/www/html/public;
        index index.php index.html;

        # Max upload size for file uploads
        client_max_body_size 50M;

        # Backend API routes — send directly to PHP-FPM
        location ^~ /api {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Laravel admin panel (Filament)
        location ^~ /admin {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Livewire assets & update endpoints (used by Filament admin panel).
        # Without this block, /livewire/* falls through to the Next.js
        # catch-all below and 404s, which breaks Filament login (the browser
        # never loads livewire.js, so the login form falls back to a native
        # POST that hits Laravel's GET-only admin/login route -> 405).
        location ^~ /livewire {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Filament package assets (published via `php artisan filament:assets`
        # into backend/public/css|js). These are pure static files — serve
        # them directly WITHOUT the /index.php fallback: without these
        # blocks they fall through to the Next.js catch-all, which 307s
        # them into /en/* locale-prefixed URLs that 404 after a full SSR
        # render each, stalling admin page loads past browser timeouts.
        location ^~ /css/ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ^~ /js/ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Laravel storage link (symlinked public files)
        location ^~ /storage {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Laravel Horizon / Telescope / other tool routes
        location ^~ /_ignition {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM Processor — handles all .php files
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }

        # Frontend (Next.js) — catch-all fallback
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
