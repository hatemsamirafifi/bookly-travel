services:
  # Next.js Frontend
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookly-frontend
    restart: unless-stopped
    command: sh -c "rm -rf /app/.next/* && npm run build && npm start"
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # SSR/ISR requests inside the Docker network use the internal hostname.
      - API_INTERNAL_URL=http://nginx
      # Empty on purpose: NEXT_PUBLIC_* values are inlined into the browser
      # bundle at build time, and browsers outside Docker cannot resolve
      # "nginx". An empty value makes client-side API calls same-origin
      # relative (/api/...), which this nginx proxy routes to Laravel.
      - NEXT_PUBLIC_API_URL=
      - DOCKER_ENV=true
    networks:
      - bookly-network
    depends_on:
      - laravel

  # Laravel Backend
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
    networks:
      - bookly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-queue
    restart: unless-stopped
    # Processes both the default queue and the `scout` queue (config/scout.php
    # queues Meilisearch index syncs on `scout`); without `scout` here, newly
    # created/updated tours never reach the search index.
    command: php artisan queue:work --queue=default,scout
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
    networks:
      - bookly-network
    depends_on:
      - laravel
      - redis

  # Laravel Task Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
    networks:
      - bookly-network
    depends_on:
      - laravel

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bookly-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
    - ./backend:/var/www/html
    - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bookly-network
    depends_on:
      - nextjs
      - laravel

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bookly-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bookly
      - POSTGRES_USER=bookly
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the `bookly_test` database for the Pest suite on a fresh
      # volume. See docker/postgres/init-test-db.sh.
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookly-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: bookly-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookly-network

  # Meilisearch Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: bookly-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-development-key}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - bookly-network

networks:
  bookly-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
