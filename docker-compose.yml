services:
  # Initialize/update the shared Linux dependency volume once before PHP starts.
  # A read-only seed avoids re-downloading the already-installed locked packages;
  # Composer still checks composer.lock and refreshes the volume when it changes.
  php-dependencies:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-php-dependencies
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f vendor/autoload.php ] && [ -f /seed-vendor/autoload.php ]; then
          cp -a /seed-vendor/. vendor/
        fi
        composer install --no-interaction --prefer-dist --no-progress --no-scripts
    volumes:
      - ./backend:/var/www/html
      - ./backend/vendor:/seed-vendor:ro
      - backend_vendor:/var/www/html/vendor
    networks:
      - bookly-network

  # Next.js Frontend
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookly-frontend
    restart: unless-stopped
    command: sh -c "rm -rf /app/.next/* && npm run build && npm start"
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # SSR/ISR requests inside the Docker network use the internal hostname.
      - API_INTERNAL_URL=http://nginx
      # Empty on purpose: NEXT_PUBLIC_* values are inlined into the browser
      # bundle at build time, and browsers outside Docker cannot resolve
      # "nginx". An empty value makes client-side API calls same-origin
      # relative (/api/...), which this nginx proxy routes to Laravel.
      - NEXT_PUBLIC_API_URL=
      - DOCKER_ENV=true
      # Local fixture CDN (cdn.bookly.test) resolves to a private Docker IP;
      # opt the image optimizer in to fetching it. Production keeps the
      # strict default (real CDN is a public IP, so the flag is a no-op).
      - ALLOW_PRIVATE_IMAGE_UPSTREAM=true
    networks:
      - bookly-network
    depends_on:
      - laravel

  # Laravel Backend
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      # Keep locked PHP dependencies on Linux; Windows bind-mount stat/read
      # latency otherwise affects cold FPM requests and every scheduler boot.
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-deterministic}
      - MAIL_MAILER=${MAIL_MAILER:-log}
    networks:
      - bookly-network
    depends_on:
      php-dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-queue
    restart: unless-stopped
    # Processes both the default queue and the `scout` queue (config/scout.php
    # queues Meilisearch index syncs on `scout`); without `scout` here, newly
    # created/updated tours never reach the search index.
    command: php artisan queue:work --queue=default,booking_emails,scout
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-deterministic}
      - MAIL_MAILER=${MAIL_MAILER:-log}
    networks:
      - bookly-network
    depends_on:
      php-dependencies:
        condition: service_completed_successfully
      laravel:
        condition: service_started
      redis:
        condition: service_started

  # Laravel Task Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookly-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bookly
      - DB_USERNAME=bookly
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - APP_URL=http://localhost
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-development-key}
      - SCOUT_DRIVER=meilisearch
      - MAIL_MAILER=${MAIL_MAILER:-log}
    networks:
      - bookly-network
    depends_on:
      php-dependencies:
        condition: service_completed_successfully
      laravel:
        condition: service_started

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bookly-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
    - ./backend:/var/www/html
    - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./docker/cdn:/var/cdn:ro
    networks:
      bookly-network:
        aliases:
          # Local fixture CDN hostname (see the cdn.bookly.test server block
          # in docker/nginx/nginx.conf). Lets every container resolve the
          # seeded http://cdn.bookly.test/... media URLs to this proxy.
          - cdn.bookly.test
    depends_on:
      - nextjs
      - laravel

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bookly-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bookly
      - POSTGRES_USER=bookly
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookly-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: bookly-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookly-network

  # Meilisearch Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: bookly-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-development-key}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - bookly-network

networks:
  bookly-network:
    driver: bridge

volumes:
  backend_vendor:
  postgres_data:
  redis_data:
  meilisearch_data:
