services:
  # PostgreSQL 15 — Primary database (constitution-mandated)
  postgres:
    image: postgres:15-alpine
    container_name: bookly-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bookly
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookly']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 — Cache, Queue, Session (constitution-mandated)
  redis:
    image: redis:7-alpine
    container_name: bookly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — Local email testing (catches all outbound email)
  mailpit:
    image: axllent/mailpit
    container_name: bookly-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
