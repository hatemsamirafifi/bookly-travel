; OPcache performance tuning for the dev containers.
;
; The backend source (including vendor/) is bind-mounted from the Windows host,
; which makes filesystem stat() calls slow. With the default
; opcache.validate_timestamps=1 / revalidate_freq=2, every request that lands
; more than 2s after the last re-stat walks the entire ~3000-file vendor/ tree
; over the slow mount, adding several seconds per request and causing E2E
; timeouts. Disabling timestamp revalidation keeps compiled bytecode in shared
; memory (shared across all FPM workers), so requests after the first are fast.
;
; Trade-off: PHP file changes are NOT picked up automatically. After editing
; backend PHP code, restart the PHP services:
;   docker compose restart laravel queue scheduler

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.revalidate_freq=60
opcache.max_accelerated_tokens=20000
opcache.max_wasted_percentage=10
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.fast_shutdown=1
; JIT is disabled: tracing JIT gives a negligible steady-state gain here but
; inflates the one-time cold compile from ~5s to ~25s, which risks the 30s E2E
; timeout on the first request after a restart. Steady-state is already ~0.5s.
opcache.jit=off
opcache.jit_buffer_size=0